<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tabla de Multiplicar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tabla de Multiplicar</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="floating">Número</ion-label>
    <ion-input type="number" [(ngModel)]="number"></ion-input>
    <ion-button expand="block" (click)="calcularTabla()">Calcular</ion-button>

    <ion-list>
      <ion-item *ngFor="let resultado of table">
        {{ number }} x {{ table.indexOf(resultado) + 1 }} = {{ resultado }}
      </ion-item>
    </ion-list>
  </ion-item>
</ion-content>
