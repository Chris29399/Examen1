<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Ecuación Cuadrática</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ecuación Cuadrática</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-item>
    <ion-label position="floating">Coeficiente a</ion-label>
    <ion-input type="number" [(ngModel)]="a"></ion-input>
    <ion-label position="floating">Coeficiente b</ion-label>
    <ion-input type="number" [(ngModel)]="b"></ion-input>
    <ion-label position="floating">Coeficiente c</ion-label>
    <ion-input type="number" [(ngModel)]="c"></ion-input>
    </ion-item>
  <ion-button expand="full" (click)="calcularEcuacion()">Calcular</ion-button>
  <ion-card *ngIf="x1 !== null && x2 !== null">
    <ion-card-header>
      <!-- Cristopher Linares 2018-7017 -->
      <ion-card-title>Resultado</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Raíz 1: {{ x1 }}</p>
      <p>Raíz 2: {{ x2 }}</p>
    </ion-card-content>
  </ion-card>
  <ion-card *ngIf="x1 === null && x2 === 0">
    <ion-card-header>
      <ion-card-title>Resultado</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>No hay raíces reales.</p>
    </ion-card-content>
  </ion-card>
  <ion-card *ngIf="x1 !== null && x2 === null">
    <ion-card-header>
      <ion-card-title>Resultado</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Única raíz real: {{ x1 }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
